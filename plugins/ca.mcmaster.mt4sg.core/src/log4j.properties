# Minimal log4j 1.2 config for VIATRA's runtime logger.
log4j.rootLogger=WARN, console
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout

# Output format: [HH:mm:ss.SSS] LoggerName - Message
log4j.appender.console.layout.ConversionPattern=[%d{HH:mm:ss.SSS}] %c{1} - %m%n

# VIATRA itself is chatty at INFO; keep it at WARN by default.
log4j.logger.org.eclipse.viatra=WARN

# Keep project logs at INFO so create/update/remove messages stay visible
log4j.logger.ca.mcmaster.mt4sg=INFO
